name: Capture Codex Fingerprint

on:
  workflow_dispatch:

jobs:
  capture:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.155.1

      - name: Write capture server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet cryptography
          $script = @'
          import socket, ssl, json, datetime
          from cryptography import x509
          from cryptography.x509.oid import NameOID
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          name = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, u"chatgpt.com")])
          cert = (x509.CertificateBuilder().subject_name(name).issuer_name(name)
                  .public_key(key.public_key()).serial_number(x509.random_serial_number())
                  .not_valid_before(datetime.datetime.utcnow())
                  .not_valid_after(datetime.datetime.utcnow()+datetime.timedelta(days=1))
                  .add_extension(x509.SubjectAlternativeName([x509.DNSName(u"chatgpt.com")]), critical=False)
                  .sign(key, hashes.SHA256()))
          open("cert.pem","wb").write(cert.public_bytes(serialization.Encoding.PEM))
          open("key.pem","wb").write(key.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.TraditionalOpenSSL, serialization.NoEncryption()))

          def parse_hello(rec):
              if len(rec)<5 or rec[0]!=0x16: return None
              p=rec[5:]
              if p[0]!=0x01: return None
              hs=int.from_bytes(p[1:4],"big"); p=p[4:4+hs]
              pos=2+32; sl=p[pos]; pos+=1+sl
              csl=int.from_bytes(p[pos:pos+2],"big"); pos+=2
              cs=["0x%04x"%int.from_bytes(p[pos+i:pos+i+2],"big") for i in range(0,csl,2)]; pos+=csl
              cl=p[pos]; pos+=1+cl
              el=int.from_bytes(p[pos:pos+2],"big"); pos+=2; end=pos+el
              exts=[];groups=[];sigs=[];vers=[];alpn=[];ks=[]
              while pos+4<=end:
                  et=int.from_bytes(p[pos:pos+2],"big"); dl=int.from_bytes(p[pos+2:pos+4],"big"); d=p[pos+4:pos+4+dl]
                  exts.append("0x%04x"%et)
                  if et==0x0a: groups=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x0d: sigs=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x2b: vers=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(1,dl-1,2)]
                  if et==0x10:
                      i=2
                      while i<dl:
                          l=d[i]; alpn.append(d[i+1:i+1+l].decode()); i+=1+l
                  if et==0x33:
                      i=2
                      while i+4<=dl:
                          ks.append("0x%04x"%int.from_bytes(d[i:i+2],"big")); kl=int.from_bytes(d[i+2:i+4],"big"); i+=4+kl
                  pos+=4+dl
              return {"cipher_suites":cs,"extensions":exts,"supported_groups":groups,"signature_algorithms":sigs,"supported_versions":vers,"alpn":alpn,"key_shares":ks}

          srv=socket.socket(); srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          srv.bind(("127.0.0.1",18443)); srv.listen(1); print("listening",flush=True)
          conn,_=srv.accept(); data=conn.recv(65535)
          hello=parse_hello(data)
          if hello:
              json.dump(hello,open("capture.json","w"),indent=2); print("CAPTURED",flush=True)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER); ctx.load_cert_chain("cert.pem","key.pem")
          try:
              sc=ctx.wrap_socket(socket.socket(_sock=conn.detach()),server_side=True)
              sc.sendall(b"HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\n{}")
          except Exception as e: print("hs:",e,flush=True)
          '@
          Set-Content -Path capture.py -Value $script -Encoding utf8

      - name: Write capture server (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install --quiet cryptography
          cat > capture.py <<'PYEOF'
          import socket, ssl, json, datetime
          from cryptography import x509
          from cryptography.x509.oid import NameOID
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          name = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, u"chatgpt.com")])
          cert = (x509.CertificateBuilder().subject_name(name).issuer_name(name)
                  .public_key(key.public_key()).serial_number(x509.random_serial_number())
                  .not_valid_before(datetime.datetime.utcnow())
                  .not_valid_after(datetime.datetime.utcnow()+datetime.timedelta(days=1))
                  .add_extension(x509.SubjectAlternativeName([x509.DNSName(u"chatgpt.com")]), critical=False)
                  .sign(key, hashes.SHA256()))
          open("cert.pem","wb").write(cert.public_bytes(serialization.Encoding.PEM))
          open("key.pem","wb").write(key.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.TraditionalOpenSSL, serialization.NoEncryption()))

          def parse_hello(rec):
              if len(rec)<5 or rec[0]!=0x16: return None
              p=rec[5:]
              if p[0]!=0x01: return None
              hs=int.from_bytes(p[1:4],"big"); p=p[4:4+hs]
              pos=2+32; sl=p[pos]; pos+=1+sl
              csl=int.from_bytes(p[pos:pos+2],"big"); pos+=2
              cs=["0x%04x"%int.from_bytes(p[pos+i:pos+i+2],"big") for i in range(0,csl,2)]; pos+=csl
              cl=p[pos]; pos+=1+cl
              el=int.from_bytes(p[pos:pos+2],"big"); pos+=2; end=pos+el
              exts=[];groups=[];sigs=[];vers=[];alpn=[];ks=[]
              while pos+4<=end:
                  et=int.from_bytes(p[pos:pos+2],"big"); dl=int.from_bytes(p[pos+2:pos+4],"big"); d=p[pos+4:pos+4+dl]
                  exts.append("0x%04x"%et)
                  if et==0x0a: groups=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x0d: sigs=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x2b: vers=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(1,dl-1,2)]
                  if et==0x10:
                      i=2
                      while i<dl:
                          l=d[i]; alpn.append(d[i+1:i+1+l].decode()); i+=1+l
                  if et==0x33:
                      i=2
                      while i+4<=dl:
                          ks.append("0x%04x"%int.from_bytes(d[i:i+2],"big")); kl=int.from_bytes(d[i+2:i+4],"big"); i+=4+kl
                  pos+=4+dl
              return {"cipher_suites":cs,"extensions":exts,"supported_groups":groups,"signature_algorithms":sigs,"supported_versions":vers,"alpn":alpn,"key_shares":ks}

          srv=socket.socket(); srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          srv.bind(("127.0.0.1",18443)); srv.listen(1); print("listening",flush=True)
          conn,_=srv.accept(); data=conn.recv(65535)
          hello=parse_hello(data)
          if hello:
              json.dump(hello,open("capture.json","w"),indent=2); print("CAPTURED",flush=True)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER); ctx.load_cert_chain("cert.pem","key.pem")
          try:
              sc=ctx.wrap_socket(socket.socket(_sock=conn.detach()),server_side=True)
              sc.sendall(b"HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\n{}")
          except Exception as e: print("hs:",e,flush=True)
          PYEOF

      - name: Run capture and codex (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "capture.py" -RedirectStandardOutput cap.log -RedirectStandardError caperr.log
          Start-Sleep -Seconds 3
          $env:OPENAI_API_KEY="sk-test"
          codex exec --skip-git-repo-check -c 'model_provider="lc"' -c 'model_providers.lc={name="lc",base_url="https://127.0.0.1:18443/x",wire_api="responses"}' -m gpt-5.1 "hi" 2>&1 | Out-Null
          Start-Sleep -Seconds 2
          Get-Content cap.log -ErrorAction SilentlyContinue

      - name: Run capture and codex (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 capture.py > cap.log 2>&1 &
          sleep 3
          OPENAI_API_KEY=sk-test timeout 60 codex exec --skip-git-repo-check \
            -c 'model_provider="lc"' \
            -c 'model_providers.lc={name="lc",base_url="https://127.0.0.1:18443/x",wire_api="responses"}' \
            -m gpt-5.1 "hi" >/dev/null 2>&1 || true
          sleep 2
          cat cap.log

      - name: Show fingerprint
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          if [ -f capture.json ]; then cat capture.json; else echo NO_CAPTURE; fi
        if: runner.os != 'Windows'

      - name: Show fingerprint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path capture.json) { Get-Content capture.json } else { Write-Host "NO_CAPTURE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-fingerprint-${{ runner.os }}
          path: capture.json
          if-no-files-found: warn
