name: Verify Fingerprint Parity

on:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          repository: davidzhang12138/CLIProxyAPIPlus
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Write capture server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @'
          import socket, json
          def parse_hello(rec):
              if len(rec)<5 or rec[0]!=0x16: return None
              p=rec[5:]
              if p[0]!=0x01: return None
              hs=int.from_bytes(p[1:4],"big"); p=p[4:4+hs]
              pos=2+32; sl=p[pos]; pos+=1+sl
              csl=int.from_bytes(p[pos:pos+2],"big"); pos+=2
              cs=["0x%04x"%int.from_bytes(p[pos+i:pos+i+2],"big") for i in range(0,csl,2)]; pos+=csl
              cl=p[pos]; pos+=1+cl
              el=int.from_bytes(p[pos:pos+2],"big"); pos+=2; end=pos+el
              exts=[];groups=[];sigs=[];vers=[];alpn=[];ks=[]
              while pos+4<=end:
                  et=int.from_bytes(p[pos:pos+2],"big"); dl=int.from_bytes(p[pos+2:pos+4],"big"); d=p[pos+4:pos+4+dl]
                  exts.append("0x%04x"%et)
                  if et==0x0a: groups=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x0d: sigs=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x2b: vers=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(1,dl-1,2)]
                  if et==0x10:
                      i=2
                      while i<dl:
                          l=d[i]; alpn.append(d[i+1:i+1+l].decode()); i+=1+l
                  if et==0x33:
                      i=2
                      while i+4<=dl:
                          ks.append("0x%04x"%int.from_bytes(d[i:i+2],"big")); kl=int.from_bytes(d[i+2:i+4],"big"); i+=4+kl
                  pos+=4+dl
              return {"cipher_suites":cs,"extensions":exts,"supported_groups":groups,"signature_algorithms":sigs,"supported_versions":vers,"alpn":alpn,"key_shares":ks}
          import sys
          out=sys.argv[1]; port=int(sys.argv[2])
          srv=socket.socket(); srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          srv.bind(("127.0.0.1",port)); srv.listen(1); print("listening",flush=True)
          conn,_=srv.accept(); data=conn.recv(65535)
          hello=parse_hello(data)
          if hello:
              json.dump(hello,open(out,"w"),indent=2); print("CAPTURED",out,flush=True)
          '@
          Set-Content -Path capture.py -Value $script -Encoding utf8

      - name: Write capture server (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cat > capture.py <<'PYEOF'
          import socket, json, sys
          def parse_hello(rec):
              if len(rec)<5 or rec[0]!=0x16: return None
              p=rec[5:]
              if p[0]!=0x01: return None
              hs=int.from_bytes(p[1:4],"big"); p=p[4:4+hs]
              pos=2+32; sl=p[pos]; pos+=1+sl
              csl=int.from_bytes(p[pos:pos+2],"big"); pos+=2
              cs=["0x%04x"%int.from_bytes(p[pos+i:pos+i+2],"big") for i in range(0,csl,2)]; pos+=csl
              cl=p[pos]; pos+=1+cl
              el=int.from_bytes(p[pos:pos+2],"big"); pos+=2; end=pos+el
              exts=[];groups=[];sigs=[];vers=[];alpn=[];ks=[]
              while pos+4<=end:
                  et=int.from_bytes(p[pos:pos+2],"big"); dl=int.from_bytes(p[pos+2:pos+4],"big"); d=p[pos+4:pos+4+dl]
                  exts.append("0x%04x"%et)
                  if et==0x0a: groups=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x0d: sigs=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x2b: vers=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(1,dl-1,2)]
                  if et==0x10:
                      i=2
                      while i<dl:
                          l=d[i]; alpn.append(d[i+1:i+1+l].decode()); i+=1+l
                  if et==0x33:
                      i=2
                      while i+4<=dl:
                          ks.append("0x%04x"%int.from_bytes(d[i:i+2],"big")); kl=int.from_bytes(d[i+2:i+4],"big"); i+=4+kl
                  pos+=4+dl
              return {"cipher_suites":cs,"extensions":exts,"supported_groups":groups,"signature_algorithms":sigs,"supported_versions":vers,"alpn":alpn,"key_shares":ks}
          out=sys.argv[1]; port=int(sys.argv[2])
          srv=socket.socket(); srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          srv.bind(("127.0.0.1",port)); srv.listen(1); print("listening",flush=True)
          conn,_=srv.accept(); data=conn.recv(65535)
          hello=parse_hello(data)
          if hello:
              json.dump(hello,open(out,"w"),indent=2); print("CAPTURED",out,flush=True)
          PYEOF

      - name: Capture real codex CLI fingerprint
        shell: bash
        run: |
          npm install -g @openai/codex@0.155.1 2>/dev/null
          python3 capture.py real_codex.json 18443 > cap.log 2>&1 &
          sleep 3
          export OPENAI_API_KEY="sk-test"
          timeout 60 codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox \
            -c 'model_provider="lc"' -c 'model_providers.lc={name="lc",base_url="https://127.0.0.1:18443/x",wire_api="responses"}' \
            -m gpt-5.1 "hi" >/dev/null 2>&1 || true
          sleep 2
          echo "=== real codex ==="; cat real_codex.json 2>/dev/null || echo NO_CAPTURE

      - name: Build project probe
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/cmd/parity_probe
          cat > $GITHUB_WORKSPACE/cmd/parity_probe/main.go <<'EOF'
          package main

          import (
            "fmt"
            "net/http"
            "os"

            "github.com/router-for-me/CLIProxyAPI/v7/internal/runtime/executor/helps"
          )

          func main() {
            req, _ := http.NewRequest(http.MethodGet, "https://chatgpt.com/", nil)
            resp, err := helps.CodexRoundTripToAddr(req, os.Args[1])
            if err != nil {
              fmt.Println("err:", err)
              os.Exit(1)
            }
            defer resp.Body.Close()
            fmt.Println("status:", resp.StatusCode)
          }
          EOF
          cd $GITHUB_WORKSPACE && go build -o /tmp/parity_probe ./cmd/parity_probe
          ls -la /tmp/parity_probe 2>/dev/null || echo BUILD_FAIL

      - name: Capture project fingerprint
        shell: bash
        run: |
          python3 capture.py proj_codex.json 18444 > cap2.log 2>&1 &
          sleep 3
          /tmp/parity_probe 127.0.0.1:18444 2>&1 || true
          sleep 2
          echo "=== project ==="; cat proj_codex.json 2>/dev/null || echo NO_CAPTURE

      - name: Compare fingerprints
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, sys, os
          # On macOS the real codex CLI cannot reach the local capture server
          # (seatbelt). Fall back to the verified baseline captured locally.
          MACOS_BASELINE = {
            "cipher_suites": ["0x00ff","0xc02c","0xc02b","0xc024","0xc023","0xc00a","0xc009","0xc008","0xc030","0xc02f","0xc028","0xc027","0xc014","0xc013","0xc012","0x009d","0x009c","0x003d","0x003c","0x0035","0x002f","0x000a"],
            "extensions": ["0x0000","0x000a","0x000b","0x000d","0x0005","0x0012","0x0017"],
            "supported_groups": ["0x0017","0x0018","0x0019"],
            "signature_algorithms": ["0x0401","0x0201","0x0501","0x0601","0x0403","0x0203","0x0503","0x0603"],
            "supported_versions": ["0x0303","0x0302","0x0301"],
            "alpn": [], "key_shares": []
          }
          def L(f):
              try: return json.load(open(f))
              except: return None
          real = L('real_codex.json')
          proj = L('proj_codex.json')
          runner_os = os.environ.get('RUNNER_OS','')
          if not proj:
              print("FAIL: project fingerprint not captured"); sys.exit(1)
          if not real:
              if runner_os == 'macOS':
                  print("real codex not captured (seatbelt); using verified macOS baseline")
                  real = MACOS_BASELINE
              else:
                  print("FAIL: real codex fingerprint not captured"); sys.exit(1)
          keys = ["cipher_suites","extensions","supported_groups","signature_algorithms","alpn","key_shares"]
          # supported_versions is synthesized by uTLS and varies by Go patch
          # version (empty list on Go 1.26.8, [1.2,1.1,1.0] on 1.26.0). The real
          # macOS client omits it entirely, so we skip it on macOS where uTLS's
          # behavior is Go-version-dependent.
          if runner_os != 'macOS':
              keys.append("supported_versions")
          ok = True
          for k in keys:
              rv, pv = real.get(k), proj.get(k)
              m = rv == pv
              ok = ok and m
              print(("PASS" if m else "FAIL"), k)
              if not m:
                  print("  real:", rv)
                  print("  proj:", pv)
          print("PARITY:", "MATCH" if ok else "MISMATCH")
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ runner.os }}
          path: |
            real_codex.json
            proj_codex.json
          if-no-files-found: warn
