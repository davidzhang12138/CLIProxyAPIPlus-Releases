name: Verify Freebuff Fingerprint Parity

on:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          repository: davidzhang12138/CLIProxyAPIPlus
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Write capture tool
        shell: bash
        run: |
          mkdir -p cmd/fbparity
          cat > cmd/fbparity/main.go <<'GOEOF'
          // Freebuff fingerprint parity tool: runs as a CONNECT capture proxy
          // (capture mode) or dials with the project's freebuff spec (probe mode).
          package main

          import (
            "encoding/binary"
            "encoding/json"
            "flag"
            "fmt"
            "io"
            "log"
            "net"
            "os"
            "strings"
            "sync"
            "time"

            utls "github.com/refraction-networking/utls"
            "github.com/router-for-me/CLIProxyAPI/v7/internal/runtime/executor/helps"
          )

          func hex2(v uint16) string { return fmt.Sprintf("0x%04x", v) }

          type hello struct {
            SNI             string   `json:"sni,omitempty"`
            CipherSuites    []string `json:"cipher_suites"`
            Extensions      []string `json:"extensions"`
            SupportedGroups []string `json:"supported_groups"`
            SignatureAlgs   []string `json:"signature_algorithms"`
            SupportedVers   []string `json:"supported_versions"`
            ALPN            []string `json:"alpn"`
            KeyShares       []string `json:"key_shares"`
          }

          func parse(rec []byte) (*hello, error) {
            if len(rec) < 5 || rec[0] != 0x16 {
              return nil, fmt.Errorf("not handshake")
            }
            recLen := int(binary.BigEndian.Uint16(rec[3:5]))
            body := rec[5 : 5+recLen]
            if body[0] != 0x01 {
              return nil, fmt.Errorf("not client hello")
            }
            hsLen := int(body[1])<<16 | int(body[2])<<8 | int(body[3])
            p := body[4 : 4+hsLen]
            h := &hello{}
            pos := 2 + 32
            sl := int(p[pos])
            pos += 1 + sl
            csl := int(binary.BigEndian.Uint16(p[pos:]))
            pos += 2
            for i := 0; i < csl; i += 2 {
              h.CipherSuites = append(h.CipherSuites, hex2(binary.BigEndian.Uint16(p[pos+i:])))
            }
            pos += csl
            cl := int(p[pos])
            pos += 1 + cl
            if pos >= len(p) {
              return h, nil
            }
            el := int(binary.BigEndian.Uint16(p[pos:]))
            pos += 2
            end := pos + el
            for pos+4 <= end {
              et := binary.BigEndian.Uint16(p[pos:])
              dl := int(binary.BigEndian.Uint16(p[pos+2:]))
              d := p[pos+4 : pos+4+dl]
              h.Extensions = append(h.Extensions, hex2(et))
              switch et {
              case 0x0000:
                if dl > 5 {
                  s := int(binary.BigEndian.Uint16(d[3:]))
                  if 5+s <= dl {
                    h.SNI = string(d[5 : 5+s])
                  }
                }
              case 0x000a:
                for i := 2; i+1 < dl; i += 2 {
                  h.SupportedGroups = append(h.SupportedGroups, hex2(binary.BigEndian.Uint16(d[i:])))
                }
              case 0x000d:
                for i := 2; i+1 < dl; i += 2 {
                  h.SignatureAlgs = append(h.SignatureAlgs, hex2(binary.BigEndian.Uint16(d[i:])))
                }
              case 0x0010:
                i := 2
                for i < dl {
                  l := int(d[i])
                  h.ALPN = append(h.ALPN, string(d[i+1:i+1+l]))
                  i += 1 + l
                }
              case 0x002b:
                for i := 1; i+1 < dl; i += 2 {
                  h.SupportedVers = append(h.SupportedVers, hex2(binary.BigEndian.Uint16(d[i:])))
                }
              case 0x0033:
                i := 2
                for i+4 <= dl {
                  h.KeyShares = append(h.KeyShares, hex2(binary.BigEndian.Uint16(d[i:])))
                  kl := int(binary.BigEndian.Uint16(d[i+2:]))
                  i += 4 + kl
                }
              }
              pos += 4 + dl
            }
            return h, nil
          }

          var (
            mu   sync.Mutex
            seen = map[string]bool{}
          )

          func handle(conn net.Conn, outDir string) {
            defer conn.Close()
            _ = conn.SetReadDeadline(time.Now().Add(30 * time.Second))
            hdr := make([]byte, 0, 4096)
            one := make([]byte, 1)
            for !strings.HasSuffix(string(hdr), "\r\n\r\n") {
              if _, err := conn.Read(one); err != nil {
                return
              }
              hdr = append(hdr, one[0])
            }
            parts := strings.Fields(strings.SplitN(string(hdr), "\r\n", 2)[0])
            if len(parts) < 2 || parts[0] != "CONNECT" {
              return
            }
            target := parts[1]
            if _, err := conn.Write([]byte("HTTP/1.1 200 Connection Established\r\n\r\n")); err != nil {
              return
            }
            buf := make([]byte, 16384)
            n, err := conn.Read(buf)
            if err != nil && n == 0 {
              return
            }
            _ = conn.SetReadDeadline(time.Time{})
            h, err := parse(buf[:n])
            if err != nil {
              return
            }
            key := h.SNI
            if key == "" {
              key = strings.Split(target, ":")[0]
            }
            mu.Lock()
            first := !seen[key]
            seen[key] = true
            mu.Unlock()
            if first {
              jb, _ := json.MarshalIndent(h, "", "  ")
              fn := fmt.Sprintf("%s/%s.json", outDir, strings.ReplaceAll(key, ".", "_"))
              if errWrite := os.WriteFile(fn, jb, 0o644); errWrite == nil {
                log.Printf("CAPTURED %s -> %s", key, fn)
              }
            }
            up, err := net.DialTimeout("tcp", target, 20*time.Second)
            if err != nil {
              return
            }
            defer up.Close()
            if _, err := up.Write(buf[:n]); err != nil {
              return
            }
            go io.Copy(up, conn)
            io.Copy(conn, up)
          }

          func main() {
            mode := flag.String("mode", "capture", "capture|probe")
            listen := flag.String("listen", "127.0.0.1:18450", "capture: listen address")
            outDir := flag.String("out", ".", "capture: output dir")
            addr := flag.String("addr", "127.0.0.1:18451", "probe: dial address")
            sni := flag.String("sni", "www.codebuff.com", "probe: TLS server name")
            flag.Parse()

            if *mode == "probe" {
              rawConn, err := net.Dial("tcp", *addr)
              if err != nil {
                fmt.Println("dial:", err)
                os.Exit(1)
              }
              tlsConn := utls.UClient(rawConn, &utls.Config{ServerName: *sni, InsecureSkipVerify: true}, utls.HelloCustom)
              if err := tlsConn.ApplyPreset(helps.FreebuffBunTLSSpecForTest()); err != nil {
                fmt.Println("preset:", err)
                os.Exit(1)
              }
              if err := tlsConn.Handshake(); err != nil {
                fmt.Println("handshake:", err)
              }
              fmt.Println("version:", tlsConn.ConnectionState().Version)
              _ = tlsConn.Close()
              return
            }

            ln, err := net.Listen("tcp", *listen)
            if err != nil {
              log.Fatal(err)
            }
            log.Printf("CONNECT proxy on %s -> %s", *listen, *outDir)
            for {
              conn, err := ln.Accept()
              if err != nil {
                return
              }
              go handle(conn, *outDir)
            }
          }
          GOEOF
          go build -o /tmp/fbparity ./cmd/fbparity && echo BUILD_OK

      - name: Capture real freebuff fingerprint
        shell: bash
        run: |
          mkdir -p out
          VERSION=0.0.180
          curl -sSL --max-time 240 "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v${VERSION}/freebuff-${{ matrix.target }}.tar.gz" -o fb.tar.gz
          mkdir -p fb && tar xzf fb.tar.gz -C fb
          ls -la fb/ | head
          /tmp/fbparity -mode capture -listen 127.0.0.1:18450 -out out > ccap.log 2>&1 &
          sleep 2
          CODEBUFF_API_KEY=sk-test HTTPS_PROXY=http://127.0.0.1:18450 HTTP_PROXY=http://127.0.0.1:18450 \
            ./fb/freebuff --cwd . > fb_run.log 2>&1 &
          FB_PID=$!
          sleep 25
          kill $FB_PID 2>/dev/null || true
          wait $FB_PID 2>/dev/null || true
          sleep 3
          pkill -f fbparity || true
          echo "=== capture log ==="; cat ccap.log
          echo "=== real freebuff ==="; cat out/www_codebuff_com.json 2>/dev/null || echo NO_CAPTURE

      - name: Capture project fingerprint
        shell: bash
        run: |
          python3 - <<'PYEOF' > /dev/null 2>&1 &
          import socket, json
          def parse(rec):
              if len(rec)<5 or rec[0]!=0x16: return None
              p=rec[5:]
              if p[0]!=0x01: return None
              hs=int.from_bytes(p[1:4],"big"); p=p[4:4+hs]
              pos=2+32; sl=p[pos]; pos+=1+sl
              csl=int.from_bytes(p[pos:pos+2],"big"); pos+=2
              cs=["0x%04x"%int.from_bytes(p[pos+i:pos+i+2],"big") for i in range(0,csl,2)]; pos+=csl
              cl=p[pos]; pos+=1+cl
              el=int.from_bytes(p[pos:pos+2],"big"); pos+=2; end=pos+el
              exts=[];groups=[];sigs=[];vers=[];alpn=[];ks=[]
              while pos+4<=end:
                  et=int.from_bytes(p[pos:pos+2],"big"); dl=int.from_bytes(p[pos+2:pos+4],"big"); d=p[pos+4:pos+4+dl]
                  exts.append("0x%04x"%et)
                  if et==0x0a: groups=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x0d: sigs=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(2,dl-1,2)]
                  if et==0x2b: vers=["0x%04x"%int.from_bytes(d[i:i+2],"big") for i in range(1,dl-1,2)]
                  if et==0x10:
                      i=2
                      while i<dl:
                          l=d[i]; alpn.append(d[i+1:i+1+l].decode()); i+=1+l
                  if et==0x33:
                      i=2
                      while i+4<=dl:
                          ks.append("0x%04x"%int.from_bytes(d[i:i+2],"big")); kl=int.from_bytes(d[i+2:i+4],"big"); i+=4+kl
                  pos+=4+dl
              return {"cipher_suites":cs,"extensions":exts,"supported_groups":groups,"signature_algorithms":sigs,"supported_versions":vers,"alpn":alpn,"key_shares":ks}
          srv=socket.socket(); srv.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          srv.bind(("127.0.0.1",18451)); srv.listen(1)
          conn,_=srv.accept(); data=conn.recv(65535)
          h=parse(data)
          if h: json.dump(h,open("out/proj_freebuff.json","w"),indent=2)
          PYEOF
          sleep 2
          /tmp/fbparity -mode probe -addr 127.0.0.1:18451 -sni www.codebuff.com 2>&1 | head -2
          sleep 2
          echo "=== project ==="; cat out/proj_freebuff.json 2>/dev/null || echo NO_CAPTURE

      - name: Compare
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, sys
          def L(p):
              try: return json.load(open(p))
              except: return None
          real=L('out/www_codebuff_com.json'); proj=L('out/proj_freebuff.json')
          if not real: print("FAIL: no real freebuff capture"); sys.exit(1)
          if not proj: print("FAIL: no project capture"); sys.exit(1)
          keys=["cipher_suites","supported_groups","signature_algorithms","supported_versions","alpn","key_shares"]
          ok=True
          for k in keys:
              m=real.get(k)==proj.get(k); ok=ok and m
              print(("PASS" if m else "FAIL"), k)
              if not m: print("  real:",real.get(k)); print("  proj:",proj.get(k))
          real_exts=real.get("extensions",[])
          proj_exts=proj.get("extensions",[])
          m=real_exts==proj_exts; ok=ok and m
          print(("PASS" if m else "FAIL"), "extensions")
          if not m: print("  real:",real_exts); print("  proj:",proj_exts)
          print("PARITY:", "MATCH" if ok else "MISMATCH")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-parity-${{ matrix.os }}
          path: |
            out/
            ccap.log
            fb_run.log
          if-no-files-found: warn
